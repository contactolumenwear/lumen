<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LUMEN Streetwear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LUMEN Streetwear. Comprá gorras, remeras, jeans y pantalones urbanos por WhatsApp e Instagram.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<button id="menuBtn" class="menu-btn">☰</button>

<aside id="sidebar" class="sidebar">
  <h2>LUMEN</h2>
  <a href="como-comprar.html">Cómo comprar</a>
  <a href="envios.html">Envíos</a>
  <a href="cambios.html">Cambios</a>
  <a href="contacto.html">Contacto</a>
</aside>

<div id="overlay"></div>

<header class="top">
  <h1>LUMEN</h1>
  <p>Ventas por WhatsApp & Instagram</p>
</header>

<section class="filters">
  <input type="text" id="search" placeholder="Buscar producto...">
  <select id="filterType">
    <option value="">Todo</option>
    <option value="gorras">Gorras</option>
    <option value="remeras">Remeras</option>
    <option value="jeans">Jeans</option>
    <option value="pantalones">Pantalones</option>
  </select>

  <select id="filterSize">
    <option value="">Talle</option>
    <option value="s">S</option>
    <option value="m">M</option>
    <option value="l">L</option>
    <option value="regulable">Regulable</option>
    <option value="cerrada">Cerrada</option>
  </select>
</section>

<section id="filteredCatalog" class="filtered hidden">
  <h2>Resultados</h2>
  <div class="grid" id="filteredProducts"></div>
</section>


<section class="catalogo" id="carouselSection">

  <h2>Gorras</h2>
  <div class="carousel">
    <button class="prev">‹</button>
    <div class="carousel-track" id="gorras"></div>
    <button class="next">›</button>
  </div>

  <h2>Remeras</h2>
  <div class="carousel">
    <button class="prev">‹</button>
    <div class="carousel-track" id="remeras"></div>
    <button class="next">›</button>
  </div>

  <h2>Jeans</h2>
  <div class="carousel">
    <button class="prev">‹</button>
    <div class="carousel-track" id="jeans"></div>
    <button class="next">›</button>
  </div>

  <h2>Pantalones</h2>
  <div class="carousel">
    <button class="prev">‹</button>
    <div class="carousel-track" id="pantalones"></div>
    <button class="next">›</button>
  </div>
</section>

<footer>
  © <span id="year"></span> LUMEN · Ventas por WhatsApp e Instagram
</footer>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
